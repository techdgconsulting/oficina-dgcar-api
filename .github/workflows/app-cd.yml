name: App CI/CD - Build, Test and Deploy

on:
  pull_request:
    branches:
      - main
      - homolog
  push:
    branches:
      - main
      - homolog
    paths:
      - "src/**"
      - "Dockerfile"
      - "pom.xml"
      - ".github/workflows/app-cd.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "homolog"
        type: choice
        options:
          - homolog
          - prod

permissions:
  contents: read

env:
  K8S_NAMESPACE: oficina
  K8S_DEPLOYMENT: oficina-api
  K8S_CONTAINER: oficina-api

jobs:
  build-test:
    name: Build and test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run automated tests
        run: mvn clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t oficina-dgcar-api:${{ github.sha }} .

  deploy:
    name: Build image, push to ECR and deploy on EKS
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION }}

      - name: Resolve deployment targets
        id: targets
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || vars.ECR_REPOSITORY }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME || vars.EKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail

          if [ -z "$AWS_REGION" ]; then
            echo "::error::AWS_REGION secret is required."
            exit 1
          fi

          if [ -z "$ECR_REPOSITORY" ]; then
            echo "::error::ECR_REPOSITORY secret is required."
            exit 1
          fi

          if [ -z "$EKS_CLUSTER_NAME" ]; then
            echo "::error::EKS_CLUSTER_NAME secret is required."
            exit 1
          fi

          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

          if [[ "$ECR_REPOSITORY" == *.amazonaws.com/* ]]; then
            ECR_REPOSITORY_URL="$ECR_REPOSITORY"
          else
            ECR_REPOSITORY_URL="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"
          fi

          IMAGE_URI="$ECR_REPOSITORY_URL:${{ github.sha }}"

          echo "aws_region=$AWS_REGION" >> "$GITHUB_OUTPUT"
          echo "eks_cluster_name=$EKS_CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$ECR_REPOSITORY_URL" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "Using EKS cluster: $EKS_CLUSTER_NAME"
          echo "Using ECR repository: $ECR_REPOSITORY_URL"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          IMAGE_URI: ${{ steps.targets.outputs.image_uri }}
        run: docker build -t "$IMAGE_URI" .

      - name: Push Docker image
        env:
          IMAGE_URI: ${{ steps.targets.outputs.image_uri }}
        run: docker push "$IMAGE_URI"

      - name: Update kubeconfig
        env:
          AWS_REGION: ${{ steps.targets.outputs.aws_region }}
          EKS_CLUSTER_NAME: ${{ steps.targets.outputs.eks_cluster_name }}
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Create or update Kubernetes namespace
        run: kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update Kubernetes config
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL || vars.SPRING_DATASOURCE_URL }}
          OFICINA_PUBLIC_BASE_URL: ${{ vars.OFICINA_PUBLIC_BASE_URL || 'http://localhost:8080' }}
          OFICINA_EMAIL_ENABLED: ${{ vars.OFICINA_EMAIL_ENABLED || 'false' }}
          OFICINA_EMAIL_MODE: ${{ vars.OFICINA_EMAIL_MODE || 'LOG' }}
          OFICINA_EMAIL_REMETENTE: ${{ vars.OFICINA_EMAIL_REMETENTE || 'no-reply@dgcar.local' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'localhost' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_AUTH: ${{ vars.SMTP_AUTH || 'true' }}
          SMTP_STARTTLS_ENABLE: ${{ vars.SMTP_STARTTLS_ENABLE || 'true' }}
          MANAGEMENT_HEALTH_MAIL_ENABLED: ${{ vars.MANAGEMENT_HEALTH_MAIL_ENABLED || 'false' }}
          PAGAMENTO_GATEWAY_APPROVAL_RATE: ${{ vars.PAGAMENTO_GATEWAY_APPROVAL_RATE || '1.0' }}
          PAGAMENTO_GATEWAY_LATENCY_MS: ${{ vars.PAGAMENTO_GATEWAY_LATENCY_MS || '0' }}
          CLIENT_JWT_ISSUER: ${{ vars.CLIENT_JWT_ISSUER || 'oficina-dgcar-auth-lambda' }}
          CLIENT_JWT_AUDIENCE: ${{ vars.CLIENT_JWT_AUDIENCE || 'oficina-dgcar-api' }}
        run: |
          set -euo pipefail

          if [ -z "$SPRING_DATASOURCE_URL" ]; then
            echo "::error::SPRING_DATASOURCE_URL secret is required."
            exit 1
          fi

          kubectl create configmap oficina-api-config -n "$K8S_NAMESPACE" \
            --from-literal=SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
            --from-literal=OFICINA_PUBLIC_BASE_URL="$OFICINA_PUBLIC_BASE_URL" \
            --from-literal=OFICINA_EMAIL_ENABLED="$OFICINA_EMAIL_ENABLED" \
            --from-literal=OFICINA_EMAIL_MODE="$OFICINA_EMAIL_MODE" \
            --from-literal=OFICINA_EMAIL_REMETENTE="$OFICINA_EMAIL_REMETENTE" \
            --from-literal=SMTP_HOST="$SMTP_HOST" \
            --from-literal=SMTP_PORT="$SMTP_PORT" \
            --from-literal=SMTP_AUTH="$SMTP_AUTH" \
            --from-literal=SMTP_STARTTLS_ENABLE="$SMTP_STARTTLS_ENABLE" \
            --from-literal=MANAGEMENT_HEALTH_MAIL_ENABLED="$MANAGEMENT_HEALTH_MAIL_ENABLED" \
            --from-literal=PAGAMENTO_GATEWAY_APPROVAL_RATE="$PAGAMENTO_GATEWAY_APPROVAL_RATE" \
            --from-literal=PAGAMENTO_GATEWAY_LATENCY_MS="$PAGAMENTO_GATEWAY_LATENCY_MS" \
            --from-literal=CLIENT_JWT_ISSUER="$CLIENT_JWT_ISSUER" \
            --from-literal=CLIENT_JWT_AUDIENCE="$CLIENT_JWT_AUDIENCE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update Kubernetes secret
        env:
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_JWT_SECRET: ${{ secrets.CLIENT_JWT_SECRET }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SPRING_DATASOURCE_USERNAME" ]; then
            echo "::error::SPRING_DATASOURCE_USERNAME secret is required."
            exit 1
          fi

          if [ -z "$SPRING_DATASOURCE_PASSWORD" ]; then
            echo "::error::SPRING_DATASOURCE_PASSWORD secret is required."
            exit 1
          fi

          if [ -z "$JWT_SECRET" ]; then
            echo "::error::JWT_SECRET secret is required."
            exit 1
          fi

          if [ -z "$CLIENT_JWT_SECRET" ]; then
            echo "::error::CLIENT_JWT_SECRET secret is required."
            exit 1
          fi

          kubectl create secret generic oficina-api-secret -n "$K8S_NAMESPACE" \
            --from-literal=SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=CLIENT_JWT_SECRET="$CLIENT_JWT_SECRET" \
            --from-literal=SMTP_USERNAME="$SMTP_USERNAME" \
            --from-literal=SMTP_PASSWORD="$SMTP_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes workload
        env:
          IMAGE_URI: ${{ steps.targets.outputs.image_uri }}
        run: |
          set -euo pipefail

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: oficina-api
            namespace: oficina
            labels:
              app.kubernetes.io/name: oficina-api
              app.kubernetes.io/part-of: oficina-mecanica-dgcar
          spec:
            replicas: 1
            revisionHistoryLimit: 3
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
            selector:
              matchLabels:
                app.kubernetes.io/name: oficina-api
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: oficina-api
                  app.kubernetes.io/part-of: oficina-mecanica-dgcar
              spec:
                automountServiceAccountToken: false
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: oficina-api
                    image: $IMAGE_URI
                    imagePullPolicy: Always
                    ports:
                      - name: http
                        containerPort: 8080
                        protocol: TCP
                    envFrom:
                      - configMapRef:
                          name: oficina-api-config
                      - secretRef:
                          name: oficina-api-secret
                    resources:
                      requests:
                        cpu: 250m
                        memory: 512Mi
                      limits:
                        cpu: 500m
                        memory: 768Mi
                    readinessProbe:
                      httpGet:
                        path: /actuator/health/readiness
                        port: http
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 6
                    livenessProbe:
                      httpGet:
                        path: /actuator/health/liveness
                        port: http
                      initialDelaySeconds: 60
                      periodSeconds: 20
                      timeoutSeconds: 3
                      failureThreshold: 3
                    securityContext:
                      allowPrivilegeEscalation: false
                      runAsUser: 10001
                      runAsGroup: 10001
                      runAsNonRoot: true
                      capabilities:
                        drop:
                          - ALL
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: oficina-api
            namespace: oficina
            labels:
              app.kubernetes.io/name: oficina-api
              app.kubernetes.io/part-of: oficina-mecanica-dgcar
          spec:
            type: LoadBalancer
            selector:
              app.kubernetes.io/name: oficina-api
            ports:
              - name: http
                protocol: TCP
                port: 80
                targetPort: http
          ---
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          metadata:
            name: oficina-api
            namespace: oficina
            labels:
              app.kubernetes.io/name: oficina-api
              app.kubernetes.io/part-of: oficina-mecanica-dgcar
          spec:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: oficina-api
            minReplicas: 1
            maxReplicas: 3
            metrics:
              - type: Resource
                resource:
                  name: cpu
                  target:
                    type: Utilization
                    averageUtilization: 70
          EOF

      - name: Wait for rollout
        run: kubectl rollout status deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=300s

      - name: Publish backend URL to infrastructure repository
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          INFRA_K8S_REPO: techdgconsulting/oficina-dgcar-infra-k8s
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_AUTOMATION_TOKEN secret is required to publish API_BACKEND_URL."
            exit 1
          fi

          LOAD_BALANCER_HOSTNAME=""
          LOAD_BALANCER_IP=""

          for attempt in $(seq 1 30); do
            LOAD_BALANCER_HOSTNAME="$(kubectl get svc oficina-api -n "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            LOAD_BALANCER_IP="$(kubectl get svc oficina-api -n "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"

            if [ -n "$LOAD_BALANCER_HOSTNAME" ] || [ -n "$LOAD_BALANCER_IP" ]; then
              break
            fi

            echo "Waiting for LoadBalancer endpoint... attempt $attempt/30"
            sleep 10
          done

          BACKEND_HOST="${LOAD_BALANCER_HOSTNAME:-$LOAD_BALANCER_IP}"

          if [ -z "$BACKEND_HOST" ]; then
            echo "::error::LoadBalancer endpoint was not published by Kubernetes service oficina-api."
            exit 1
          fi

          API_BACKEND_URL="http://$BACKEND_HOST"

          gh secret set API_BACKEND_URL \
            --repo "$INFRA_K8S_REPO" \
            --env "$TARGET_ENVIRONMENT" \
            --body "$API_BACKEND_URL"

          echo "API_BACKEND_URL published to $INFRA_K8S_REPO/$TARGET_ENVIRONMENT."
          echo "Application URL: $API_BACKEND_URL"
          echo "Swagger URL: $API_BACKEND_URL/swagger-ui.html"

      - name: Print deployment evidence
        run: |
          kubectl get deployment,pods,svc,hpa -n "$K8S_NAMESPACE"
          LOAD_BALANCER_HOSTNAME="$(kubectl get svc oficina-api -n "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || true)"
          if [ -n "$LOAD_BALANCER_HOSTNAME" ]; then
            echo "Application URL: http://$LOAD_BALANCER_HOSTNAME"
            echo "Swagger URL: http://$LOAD_BALANCER_HOSTNAME/swagger-ui.html"
          else
            echo "LoadBalancer hostname is not available yet."
          fi
