name: App CI/CD - Build, Test and Package

on:
  pull_request:
    branches:
      - main
      - homolog
  push:
    branches:
      - homolog
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - "pom.xml"
      - ".github/workflows/app-cd.yml"

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run automated tests
        run: mvn clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t oficina-dgcar-api:${{ github.sha }} .
