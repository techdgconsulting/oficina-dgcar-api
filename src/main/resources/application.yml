spring:
  application:
    name: oficina-mecanica-dgcar

  datasource:
    url: jdbc:postgresql://localhost:5432/oficina
    username: oficina
    password: oficina123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:minha-chave-secreta-temporaria-trocar-em-producao}
  expiration: 86400000

oficina:
  notificacao:
    base-url: ${OFICINA_PUBLIC_BASE_URL:http://localhost:8080}
    orcamento:
      expiracao-horas: ${ORCAMENTO_DECISAO_EXPIRACAO_HORAS:48}
  email:
    enabled: ${OFICINA_EMAIL_ENABLED:true}
    mode: ${OFICINA_EMAIL_MODE:LOG}
    remetente: ${OFICINA_EMAIL_REMETENTE:no-reply@oficina.local}
  pagamento:
    gateway:
      # Taxa de aprovação simulada (0.0 = sempre recusa, 1.0 = sempre aprova)
      approval-rate: ${PAGAMENTO_GATEWAY_APPROVAL_RATE:0.9}
      # Latência simulada em ms
      latency-ms: ${PAGAMENTO_GATEWAY_LATENCY_MS:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:oficina
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:oficina-test
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false
